<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Casual Draw</title>
    <link href="src/styles/index.scss" rel="stylesheet" />
    <link href="src/styles/font-awesome.min.css" rel="stylesheet" />
</head>

<body>
    <header>
        <span class="title">Casual Draw</span>

        <div id="toolbar" class="toolbar">
            <button id="compile-button" type="button">Compile</button>
            <button id="fit-button" type="button">Fit</button>
            <button id="zoom-out-button" type="button" aria-label="Zoom out">−</button>
            <button id="zoom-in-button" type="button" aria-label="Zoom in">+</button>
            <button id="reset-button" type="button">Reset</button>
            <div class="toolbar-tooltip">
                <button id="export-button" type="button" aria-describedby="export-button-tooltip">Export</button>
                <span id="export-button-tooltip" class="toolbar-tooltip-text" role="tooltip">Export as .PNG</span>
            </div>
        </div>
    </header>

    <div id="content">
        <div class="vertical-split-pane">
            <div id="lft-pane" class="left">
                <div id="editor-panel" class="editor-panel">
                    <div id="editor"></div>
                </div>
                <div id="status" class="status">Ready</div>
            </div>

            <div id="rh" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize editor panel" tabindex="0">
                <div class="resize-mark">
                    <i class="fa fa-lg fa-arrows-h"></i>
                </div>
            </div>

            <div class="right">
                <div class="canvas-area">
                    <canvas id="canvas"></canvas>
                    <div id="overlay"></div>
                    <div class="canvas-mode-bar">
                        <div class="mode-switch" role="group" aria-label="Editor mode">
                            <button id="mode-live-button" type="button" aria-pressed="true">Live</button>
                            <button id="mode-demo-button" type="button" aria-pressed="false">Demo</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/ts/main.ts"></script>
</body>

</html>
