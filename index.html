<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Casual Draw</title>
    <link href="src/styles/index.scss" rel="stylesheet" />
    <link href="src/styles/font-awesome.min.css" rel="stylesheet" />
</head>

<body>
    <header>
        <span>Causality (PoC)</span>
    </header>

    <div id="content">
        <div class="vertical-split-pane">
            <div id="lft-pane" class="left">
                left
            </div>

                    <i class="fa fa-lg fa-arrows-h"></i>
                </div>
            </div>

            <div class="right">
                <div class="canvas-area">
                    <canvas id="canvas"></canvas>
                    <div id="overlay"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/ts/main.ts"></script>

</html>
